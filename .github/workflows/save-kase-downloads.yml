name: Save KASE report downloads
on:
  push:
    paths:
      - 'KASE/transfer/READY'
permissions: {}
jobs:
  save-files:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify and save report files using Python standard library
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64, hashlib, io, json, os, tarfile, urllib.request, urllib.error, zipfile
          repo = os.environ["REPO"]
          assert repo == "sabinarahmedia-ux/Project"
          raw = "https://raw.githubusercontent.com/" + repo + "/main/KASE/transfer/"
          def get(url):
              with urllib.request.urlopen(url, timeout=60) as response:
                  return response.read()
          manifest = json.loads(get(raw + "manifest.json"))
          data = base64.b64decode(get(raw + "archive.b64"), validate=True)
          assert hashlib.sha256(data).hexdigest() == manifest["sha256"]
          files = {}
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:xz") as archive:
              for member in archive.getmembers():
                  assert member.isfile() and "/" not in member.name and "\\" not in member.name
                  assert member.name in manifest["files"]
                  blob = archive.extractfile(member).read()
                  assert hashlib.sha256(blob).hexdigest() == manifest["files"][member.name]
                  files[member.name] = blob
          assert set(files) == set(manifest["files"])
          zipped = io.BytesIO()
          with zipfile.ZipFile(zipped, "w", zipfile.ZIP_DEFLATED) as archive:
              for name, blob in sorted(files.items()):
                  archive.writestr(name, blob)
          files["KASE_All_Files.zip"] = zipped.getvalue()
          for name, blob in sorted(files.items()):
              url = "https://api.github.com/repos/" + repo + "/contents/KASE/files/" + name
              headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
              try:
                  urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  raise RuntimeError("Refusing to overwrite existing file: " + name)
              body = json.dumps({"message": "Save requested KASE deliverable: " + name, "content": base64.b64encode(blob).decode(), "branch": "main"}).encode()
              request = urllib.request.Request(url, data=body, headers={**headers, "Content-Type": "application/json"}, method="PUT")
              with urllib.request.urlopen(request, timeout=120) as response:
                  assert response.status == 201
              print("Saved:", name)
